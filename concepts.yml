context: email-marketing
name: Email Marketing
intro: >-
  The common email-marketing vocabulary -- the lists and segments an audience is organised
  into, the subscribers on them, the campaigns sent to them, the automations that send on a
  trigger and the reports that measure the result -- distilled from the APIs that already
  exist. Templates belong to the messaging context.
tags: [Email Marketing, Marketing Automation, Newsletter, Newsletters, SMS Marketing]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, total_items]

common_fields:
  id: [uuid, guid, object_id, record_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, timestamp_opt, added_at, subscribed_at]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified, last_changed]
  metadata: [meta_data, custom_fields, custom, attributes, properties, merge_fields, fields]
  status: [state, subscription_status, campaign_status]
  name: [title, display_name, label]
  description: [notes, note, details]
  list_id: [list, list_ids, lists, audience_id, audience, group_id, groups]

concepts:
  list:
    segments: [lists, list, audiences, audience, mailing_lists, mailing-lists, mailinglists, contact_lists, contact-lists, groups@lists|audiences|subscribers]
    aliases:
      subscriber_count: [member_count, members_count, contact_count, subscribers_count, total_subscribers, stats, size, count]
      double_opt_in: [opt_in_type, double_optin, confirmed_opt_in]
      from_email: [default_from_email, sender_email, reply_to]
  subscriber:
    requires: [list]
    segments: [subscribers, subscriber, members@lists|audiences|list, contacts, contact, profiles, recipients@lists]
    aliases:
      email: [email_address, emails]
      first_name: [firstname, fname, given_name]
      last_name: [lastname, lname, surname]
      phone: [phone_number, sms_number, mobile]
      unsubscribed_at: [unsubscribed, unsubscribe_date, opted_out_at]
      tags: [labels, tag_ids]
      source: [signup_source, origin, opt_in_source]
  segment:
    requires: [list]
    segments: [segments, segment, saved_segments, filters@lists]
    aliases:
      conditions: [criteria, rules, definition, filter, options]
      subscriber_count: [member_count, size, count]
  campaign:
    requires: [list]
    segments: [campaigns, campaign, newsletters, broadcasts, broadcast, emails@campaigns|marketing, mailings, sends@campaigns]
    aliases:
      subject: [subject_line, email_subject, title]
      from_email: [sender_email, from_address, from, reply_to]
      from_name: [sender_name]
      sent_at: [send_time, sent_date, scheduled_at, send_at, sent_on, schedule_time]
      template_id: [template, template_name]
      type: [campaign_type, channel, kind]
  automation:
    requires: [list]
    segments: [automations, automation, workflows, flows, journeys, autoresponders, sequences, drips]
    aliases:
      trigger: [trigger_type, triggers, start_trigger, entry_trigger]
      steps: [actions, emails, nodes, stages]
  campaign_report:
    requires: [campaign]
    path: /campaigns/{campaign_id}/reports
    segments: ["reports@campaigns|campaign", "stats@campaigns|campaign|newsletters|broadcasts", "statistics@campaigns|campaign", "metrics@campaigns|campaign", "summary@campaigns"]
    aliases:
      opens: [open_count, unique_opens, opens_total, opened, open_rate]
      clicks: [click_count, unique_clicks, clicks_total, clicked, click_rate]
      bounces: [bounce_count, hard_bounces, soft_bounces, bounced]
      unsubscribes: [unsubscribe_count, unsubscribed]
      sent: [emails_sent, sent_count, recipients, delivered]

exclude:
  campaign:
    ghost-org: /newsletters are publications, not sends
    buttondown: /newsletters are publications, not sends
  subscriber:
    activecampaign: /ai-customizations/v1/profiles are AI profile settings
  automation:
    emotive: /ticket_systems/{id}/flows are support-ticket flows
duplicates:
  keap: [infusionsoft]

findings:
  - "A subscriber agrees on email, first and last name, custom fields and when they joined --
    the merge-field model every email platform inherited."
  - "A campaign agrees only on id, name, status and created_at: subject, sender and send time
    are each modelled too differently to share, because a campaign is a draft, a schedule and
    a send at once."
  - "Campaign reports agree on nothing. Opens, clicks, bounces and unsubscribes are counted
    by every platform, each with its own field names and unique-versus-total semantics."
decisions:
  - "A list covers audiences, mailing lists and contact lists; a subscriber covers contacts,
    profiles and list members -- but only at a provider that also exposes lists."
  - "A campaign covers broadcasts and mailings; a publication-level newsletter (Ghost,
    Buttondown) is not a send and is excluded."
  - "An automation covers workflows, flows, journeys, sequences and autoresponders."
  - "Templates are the messaging context's and are not duplicated here."
  - "Duplicates merged: Infusionsoft into Keap."
